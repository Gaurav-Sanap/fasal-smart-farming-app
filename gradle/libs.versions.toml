[versions]
agp = "8.13.2"
kotlin = "2.0.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
playServicesLocation = "21.3.0"
retrofit = "3.0.0"
glide = "5.0.0-rc01"
mlkitImageLabeling = "17.0.9"
androidxCamera = "1.5.3"
flexbox = "3.0.0"
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"
tensorflowLite = "2.14.0"
